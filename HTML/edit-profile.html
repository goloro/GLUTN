<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLUTN - Edit Profile</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/edit-profile.css">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <header class="edit-header">
        <a href="settings.html" class="back-btn"><i class="ph ph-caret-left"></i></a>
        <h1 class="header-title" data-i18n="edit_profile.title">Editar Perfil</h1>
        <div></div>
    </header>

    <main class="edit-content">
        <div class="avatar-section">
            <div class="avatar-placeholder" id="edit-avatar">?</div>
        </div>

        <form class="edit-form" id="edit-profile-form">
            
            <div class="form-group">
                <label for="username" data-i18n="edit_profile.username">Nombre de usuario</label>
                <input type="text" id="username" placeholder="tu_usuario">
            </div>

            <div style="display: flex; gap: 16px;">
                <div class="form-group" style="flex: 1;">
                    <label for="name" data-i18n="edit_profile.first_name">Nombre</label>
                    <input type="text" id="name" placeholder="Tu nombre" disabled>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="lastName" data-i18n="edit_profile.last_name">Apellidos</label>
                    <input type="text" id="lastName" placeholder="Tus apellidos" disabled>
                </div>
            </div>

            <div class="form-group">
                <label for="email" data-i18n="edit_profile.email">Email</label>
                <input type="email" id="email" placeholder="tucorreo@ejemplo.com" disabled>
            </div>

            <hr style="border: none; border-top: 1px solid var(--border-color); margin: 16px 0;">

            <div class="form-group">
                <label for="newPassword" data-i18n="edit_profile.new_password">Nueva Contraseña</label>
                <div class="input-wrapper" style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="newPassword" placeholder="••••••••" style="width: 100%;">
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" data-i18n="edit_profile.confirm_password">Repetir Contraseña</label>
                <div class="input-wrapper" style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="confirmPassword" placeholder="••••••••" style="width: 100%;">
                </div>
            </div>
            
            <div class="save-btn-container">
                <button type="submit" class="btn-save" id="save-btn" data-i18n="edit_profile.save">Guardar Cambios</button>
            </div>
            
            <div id="status-msg" style="text-align: center; margin-top: -10px; font-size: 14px; display: none;"></div>
        </form>
    </main>

    <!-- Scripts -->
    <script type="module" src="../JS/firebase-config.js"></script>
    <script type="module" src="../JS/edit-profile.js"></script>
    <script src="../JS/i18n.js"></script>

</body>
</html>
