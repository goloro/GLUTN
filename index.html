<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GLUTN</title>

        <link rel="shortcut icon" href="Images/Logos/Glutn_Logo-ShortIcon.PNG" type="image/x-icon">

        <!-- Fuentes y Iconos -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <!-- CSS -->
        <link rel="stylesheet" href="CSS/home.css?v=2">
        <link rel="stylesheet" href="CSS/history.css">
    </head>
    <body>
        <img id="main-logo" src="Images/Logos/Glutn_Logo.PNG" alt="Logo de GLUTN">

        <div class="scanner">
            <h1 data-i18n="home.scan_title">Escanear Etiqueta</h1>
            <p data-i18n="home.scan_subtitle">Comprueba instantáneamente<br>si un producto es seguro para ti.</p>
            
            <button class="abrir-scanner-btn" onclick="window.location.href='HTML/scanner.html'">
                <i class="ph ph-qr-code"></i>
                <span data-i18n="home.open_scanner">Abrir Scanner</span>
            </button>

            <div class="scanner-icon" onclick="window.location.href='HTML/scanner.html'" style="cursor: pointer;">
                <i class="ph ph-barcode"></i>
            </div>
        </div>

        <div class="language-selector">
            <button class="lang-btn" id="lang-btn">
                <i class="ph ph-globe"></i>
                <span id="current-lang">Español</span>
                <i class="ph ph-caret-down"></i>
            </button>
            <div class="lang-dropdown" id="lang-dropdown">
                <div class="lang-option" data-lang="Español" style="display: none;">Español</div>
                <div class="lang-option" data-lang="English">English</div>
                <div class="lang-option" data-lang="Français">Français</div>
                <div class="lang-option" data-lang="Deutsch">Deutsch</div>
                <div class="lang-option" data-lang="Italiano">Italiano</div>
            </div>
        </div>

        <div class="last-scan">
            <h2 data-i18n="home.last_scan">Último escaneo</h2>
            <!-- Este contenedor se rellenará dinámicamente desde JS -->
            <div id="last-scan-container"></div>
        </div>

        <!-- Pantalla de Detalle de Escaneo (Oculta por defecto) -->
        <div class="history-detail-overlay" id="history-detail-screen">
            <header class="detail-header">
                <!-- Cerramos la ventana al hacer click en el logo -->
                <img src="Images/Logos/Glutn_Logo_SinFondo.png" alt="Logo de GLUTN" onclick="document.getElementById('history-detail-screen').classList.remove('active')">
            </header>

            <div class="detail-content-wrapper">
                <h1 class="detail-title" id="detail-title">Producto</h1>
                <span class="detail-time" id="detail-time">Tiempo</span>
                
                <div class="detail-badge" id="detail-badge">
                    <i class="ph-fill ph-x-circle"></i> No Apto
                </div>

                <!-- Explicación -->
                <div class="detail-reason">
                    <h3 data-i18n="scanner.why">Por qué:</h3>
                    <p id="detail-reason-text">Razón</p>
                </div>

                <!-- Lista de ingredientes -->
                <div class="detail-ingredients">
                    <h4 data-i18n="scanner.ingredients_list">Lista de ingredientes</h4>
                    <ul id="detail-ingredients-list">
                    </ul>
                </div>
                
                <!-- Botón de nuevo escaneo -->
                <div class="detail-action">
                    <button class="detail-new-scan-btn" onclick="window.location.href='HTML/scanner.html'">
                        <i class="ph ph-qr-code"></i> <span data-i18n="scanner.new_scan">Nuevo escaneo</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-bar-item active" id="home-button" onclick="window.location.href='index.html'">
                <i class="ph-fill ph-house"></i>
                <a href="index.html" data-i18n="nav.home">Inicio</a>
            </div>
            <div class="nav-bar-item" id="scan-button" onclick="window.location.href='HTML/scanner.html'">
                <i class="ph ph-camera"></i>
                <a href="HTML/scanner.html" data-i18n="nav.scan">Escanear</a>
            </div>
            <div class="nav-bar-item" id="history-button" onclick="window.location.href='HTML/history.html'">
                <i class="ph ph-clock-counter-clockwise"></i>
                <a href="HTML/history.html" data-i18n="nav.history">Historial</a>
            </div>
        </div>
        
        <!-- Scripts -->
        <script src="JS/i18n.js"></script>
        <script src="JS/home.js"></script>
    </body>
</html>
